version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: the_sun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_sun_solar
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d the_sun_solar']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
